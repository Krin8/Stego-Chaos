name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow scipy matplotlib seaborn tqdm wget opencv-python-headless \
            SimpleITK pydicom torchmetrics pytorch-lightning tensorboard hydra-core omegaconf \
            pytest pytest-cov
      - name: Run tests
        run: pytest -q --cov=src --cov-report=term-missing
